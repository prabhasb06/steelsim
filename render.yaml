services:
  - type: web
    name: steelsim
    runtime: python
    region: oregon
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STEELSIM_ALLOWED_ORIGINS
        value: "*"
